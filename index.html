<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Manager Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<h1>Products</h1>

<div class="row">
<input id="productInput" placeholder="New product">
<button onclick="addProduct()">Add</button>
</div>

<div id="productList"></div>

<hr>

<h2 id="currentProduct"></h2>

<div class="dashboard">
<span>Total: <b id="total">0</b></span>
<span>Active: <b id="active">0</b></span>
<span>Expired: <b id="expired">0</b></span>
</div>

<button class="primary" onclick="openForm()">+ Add Account</button>

<div id="accountList"></div>

</div>

<!-- FORM MODAL -->
<div id="formModal" class="modal">
<div class="modal-box">

<h3 id="formTitle">Add Account</h3>

<input id="subName" placeholder="Subscription name">
<select id="subStatus">
<option>claimed</option>
<option>failed</option>
<option>retry</option>
</select>

<input id="claimedDate" type="date">

<div class="row">
<input id="duration" type="number" placeholder="Duration">
<select id="durationType">
<option value="days">Days</option>
<option value="weeks">Weeks</option>
<option value="months">Months</option>
</select>
</div>

<hr>

<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" placeholder="Password">

<select id="type">
<option>trial</option>
<option>hitter</option>
<option>purchased</option>
</select>

<select id="statusTag">
<option>using</option>
<option>sold</option>
<option>free</option>
<option>gave</option>
</select>

<textarea id="note" placeholder="Note"></textarea>

<button class="primary" onclick="saveAccount()">Save</button>
<button onclick="closeForm()">Cancel</button>

</div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="modal">
<div class="modal-box" id="detailContent"></div>
</div>

<script src="app.js"></script>
</body>
</html>
