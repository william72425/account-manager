<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Manager</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
  <div class="topbar">Account Manager</div>

  <input id="productInput" placeholder="New product">
  <button onclick="addProduct()">Add</button>

  <div id="productList"></div>

  <h2 id="currentProduct"></h2>

  <button onclick="toggleForm()">Add Account</button>

  <div id="accountList"></div>

  <div id="form" style="display:none;">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password">

    <input id="duration" type="number" placeholder="Duration">

    <select id="durationType">
      <option value="days">Days</option>
      <option value="weeks">Weeks</option>
      <option value="months">Months</option>
    </select>

    <select id="statusTag">
      <option>Using</option>
      <option>Sold</option>
      <option>Free</option>
    </select>

    <button onclick="addAccount()">Save</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
